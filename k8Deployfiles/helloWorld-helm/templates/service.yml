apiVersion: v1
kind: Service

metadata:
  name: {{ include "myapp.fullname" . }}
  namespace: {{ .Values.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"

spec:

  type: {{ .Values.service.type }}

  selector:
    app: {{ include "myapp.name" . }}

  ports:

  - port: {{ .Values.service.port }}
    targetPort: {{ .Values.service.targetPort }}