name: Build Application
on:
  [workflow_dispatch]
jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker Image
      run: |
        docker build -t mallikarjuna18/hello-world:latest ./app
    - name: Push Docker Image
      run: |
        docker push mallikarjuna18/hello-world:latest
