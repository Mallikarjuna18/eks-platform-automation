name: Build Application
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: self-hosted
    steps:
    - uses: actions/checkout@v4
    - name: Build Docker Image
      run: |
        docker build -t malli183/helloworld:latest ./app
    - name: Push Docker Image
      run: |
        docker push malli183/helloworld:latest
